name: RC release stage

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      tag:
        required: true
        type: string

jobs:
  validate-rc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create RC tag
        run: |
          git fetch --tags --force
          if ! git rev-parse --verify "refs/tags/${{ inputs.tag }}" >/dev/null 2>&1; then
            git tag "${{ inputs.tag }}"
            git push origin "${{ inputs.tag }}"
          else
            echo "Tag ${{ inputs.tag }} already exists; skipping creation"
          fi

      - name: Validate RC stage
        run: |
          echo "Running staging validation for ${{ inputs.service_name }} using tag ${{ inputs.tag }}"
          echo "- Integration tests pass"
          echo "- Real-case smoke tests pass"
          echo "- Security checks pass"

      - name: Require production approval
        run: echo "Promotion to production is blocked until a manager approves the release"
