name: Release orchestrator

permissions:
  contents: write
  pull-requests: read

on:
  workflow_dispatch:
    inputs:
      service_name:
        description: Service/repo being released
        required: true
        type: string
        default: sample-service
      pr_title:
        description: Conventional commit title used to calculate the next version
        required: true
        type: string
        default: "feat: add release automation"
      manager_team:
        description: Manager team allowed to approve production release
        required: false
        type: string
        default: release-managers
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      pr_title:
        required: true
        type: string
      manager_team:
        required: false
        type: string
        default: release-managers

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      dev_tag: ${{ steps.derive.outputs.dev_tag }}
      rc_tag: ${{ steps.derive.outputs.rc_tag }}
      release_tag: ${{ steps.derive.outputs.release_tag }}
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine bump type from PR title
        id: bump
        env:
          PR_TITLE: ${{ inputs.pr_title || github.event.inputs.pr_title }}
        run: |
          TITLE="${PR_TITLE,,}"
          BUMP="patch"

          if [[ "$TITLE" =~ (^|[[:space:]])feat(\(|:|!|$) ]] || [[ "$TITLE" =~ (^|[[:space:]])feature(\(|:|!|$) ]]; then
            BUMP="minor"
          fi

          if [[ "$TITLE" =~ (^|[[:space:]])fix(\(|:|!|$) ]]; then
            BUMP="patch"
          fi

          if [[ "$TITLE" =~ (breaking[[:space:]]change|!:) ]]; then
            BUMP="major"
          fi

          echo "bump=${BUMP}" >> "$GITHUB_OUTPUT"

      - name: Compute next release tag
        id: version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: ${{ steps.bump.outputs.bump }}
          tag_prefix: v
          release_branches: main
          dry_run: true

      - name: Derive dev/rc/final tags
        id: derive
        env:
          NEXT_TAG: ${{ steps.version.outputs.new_tag }}
        run: |
          echo "dev_tag=${NEXT_TAG}-dev" >> "$GITHUB_OUTPUT"
          echo "rc_tag=${NEXT_TAG}-rc" >> "$GITHUB_OUTPUT"
          echo "release_tag=${NEXT_TAG}" >> "$GITHUB_OUTPUT"

  dev:
    needs: prepare
    uses: ./.github/workflows/dev-stage.yml
    with:
      service_name: ${{ inputs.service_name || github.event.inputs.service_name }}
      tag: ${{ needs.prepare.outputs.dev_tag }}

  rc:
    needs: [prepare, dev]
    if: ${{ needs.dev.result == 'success' }}
    uses: ./.github/workflows/rc-stage.yml
    with:
      service_name: ${{ inputs.service_name || github.event.inputs.service_name }}
      tag: ${{ needs.prepare.outputs.rc_tag }}

  prod-approval:
    needs: [prepare, rc]
    if: ${{ needs.rc.result == 'success' }}
    uses: ./.github/workflows/prod-approval.yml
    with:
      service_name: ${{ inputs.service_name || github.event.inputs.service_name }}
      release_tag: ${{ needs.prepare.outputs.release_tag }}
      manager_team: ${{ inputs.manager_team || github.event.inputs.manager_team }}
