name: Dev release stage

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      tag:
        required: true
        type: string

jobs:
  validate-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create dev tag
        run: |
          git fetch --tags --force
          if ! git rev-parse --verify "refs/tags/${{ inputs.tag }}" >/dev/null 2>&1; then
            git tag "${{ inputs.tag }}"
            git push origin "refs/tags/${{ inputs.tag }}"
          else
            echo "Tag ${{ inputs.tag }} already exists; skipping creation"
          fi

      - name: Validate development stage
        run: |
          echo "Running dev validation for ${{ inputs.service_name }} using tag ${{ inputs.tag }}"
          echo "- Lint pass"
          echo "- Unit tests pass"
          echo "- Smoke tests pass"

      - name: Promote to RC
        run: echo "Ready to promote ${{ inputs.tag }} to the RC stage"
